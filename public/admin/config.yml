backend:
  name: github
  repo: Patrickhobley/hobley-site
  branch: main

site_url: https://hobley.me
display_url: https://hobley.me
logo_url: /favicon.svg

# Uploaded images are saved in public/images and served from /images.
media_folder: public/images
public_folder: /images

media_libraries:
  default:
    config:
      # Cloudflare rejects files over 25 MB, so uploads stop there rather than breaking the site.
      max_file_size: 25000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 800
          height: 800
        svg:
          optimize: true

collections:
  - name: links
    label: Buttons
    label_singular: button
    description: The big buttons on the home page. Lower numbers appear first.
    folder: src/content/links
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    fields:
      - label: Button text
        name: title
        widget: string
      - label: Web address
        name: url
        widget: string
        pattern: ["^(https?://|mailto:).+", "Start with https:// (or mailto: for an email address)"]
        hint: The full address the button opens, for example https://www.alamy.com/portfolio/hobley or mailto:you@example.com
      - label: Section
        name: group
        widget: select
        default: work
        options:
          - { label: Work, value: work }
          - { label: Support, value: support }
          - { label: Get in touch, value: contact }
        hint: Which heading the button sits under on the home page.
      - label: Highlight this button
        name: featured
        widget: boolean
        default: false
        required: false
        hint: Shows the button in mustard so it stands out. Use it for one button.
      - label: Position
        name: order
        widget: number
        value_type: int
        min: 1
        default: 50
        hint: Lower numbers appear first. Use gaps like 10, 20, 30 so you can slot new buttons in between.
      - label: This is an affiliate link
        name: sponsored
        widget: boolean
        default: false
        required: false
        hint: Tick this for paid or affiliate links such as Amazon.

  - name: socials
    label: Social icons
    label_singular: social icon
    description: The round icons at the bottom of the home page. Lower numbers appear first.
    folder: src/content/socials
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    fields:
      - label: Name
        name: title
        widget: string
        hint: Shown when someone hovers over the icon and read out by screen readers.
      - label: Platform
        name: platform
        widget: select
        default: website
        options:
          - { label: Instagram, value: instagram }
          - { label: Twitter / X, value: x }
          - { label: YouTube, value: youtube }
          - { label: Twitch, value: twitch }
          - { label: Steam, value: steam }
          - { label: Spotify, value: spotify }
          - { label: LinkedIn, value: linkedin }
          - { label: Email, value: email }
          - { label: Other website, value: website }
        hint: Picks which icon is shown.
      - label: Web address
        name: url
        widget: string
        pattern: ["^(https?://|mailto:).+", "Start with https:// (or mailto: for an email address)"]
        hint: For example https://www.instagram.com/hobley/
      - label: Position
        name: order
        widget: number
        value_type: int
        min: 1
        default: 70
        hint: Lower numbers appear first. Use gaps like 10, 20, 30 so you can slot new icons in between.

  - name: gallery
    label: Gallery
    label_singular: gallery item
    description: Photos and videos shown on the Gallery page.
    folder: src/content/gallery
    media_folder: /public/gallery
    public_folder: /gallery
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [title, date]
    fields:
      - label: Title
        name: title
        widget: string
      - label: Type
        name: kind
        widget: select
        default: image
        options:
          - { label: Photo, value: image }
          - { label: Video, value: video }
      - label: Photo (or video cover image)
        name: image
        widget: image
        required: false
        hint: Upload the photo here. For a video, this is the cover shown in the gallery.
      - label: Photo description
        name: alt
        widget: string
        required: false
        hint: A short description of what is in the picture, for people using screen readers.
      - label: Video link
        name: video_url
        widget: string
        required: false
        hint: Paste a YouTube or Vimeo link. Vimeo videos also need a cover image above.
      - label: Video file
        name: video_file
        widget: file
        required: false
        choose_url: false
        hint: Or upload an MP4 up to 25 MB. For longer videos use a YouTube or Vimeo link.
      - label: Caption
        name: caption
        widget: text
        required: false
      - label: Tags
        name: tags
        widget: relation
        collection: tags
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        hint: Pick as many as fit. Add new tags under Tags in the menu.
      - label: Date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        default: "{{now}}"
        hint: Newest items appear first.
      - label: Show near the top of the home page
        name: featured
        widget: boolean
        default: false


  - name: tags
    label: Tags
    label_singular: tag
    description: The categories used to filter the gallery menu. Rename or add them here.
    folder: src/content/tags
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    fields:
      - label: Name
        name: title
        widget: string

  - name: pages
    label: Profile
    files:
      - name: profile
        label: Profile
        file: src/content/profile.json
        format: json
        fields:
          - label: Name
            name: name
            widget: string
          - label: Line under the name
            name: subtitle
            widget: string
            required: false
          - label: Intro
            name: intro
            widget: text
            required: false
            hint: One or two short sentences shown under the name.
          - label: Picture
            name: avatar
            widget: image
            required: false
            hint: Upload a square picture. It is shown as a circle.
      - name: music
        label: Music player (Miami theme)
        file: src/content/music.json
        format: json
        fields:
          - label: Song name
            name: title
            widget: string
          - label: Artist
            name: artist
            widget: string
          - label: Audio file (best option)
            name: audio
            widget: file
            required: false
            choose_url: false
            media_folder: /public/audio
            public_folder: /audio
            hint: Upload an MP3 you have the rights to use (up to 25 MB). It plays in full, with no video and no Spotify needed.
          - label: Spotify song link
            name: spotify
            widget: string
            required: false
            pattern: ["^https://open\\.spotify\\.com/(intl-[a-z]+/)?track/[A-Za-z0-9]{22}.*", "Paste a Spotify song link"]
            hint: Used when there is no audio file. Visitors who are not logged in to Spotify hear a 30 second preview.

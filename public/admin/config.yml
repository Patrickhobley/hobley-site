backend:
  name: github
  repo: Patrickhobley/hobley-site
  branch: main

site_url: https://hobley.me
display_url: https://hobley.me
logo_url: /favicon.svg

# Uploaded images are saved in public/images and served from /images.
media_folder: public/images
public_folder: /images

media_libraries:
  default:
    config:
      # Cloudflare rejects files over 25 MB, so uploads stop there rather than breaking the site.
      max_file_size: 25000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 800
          height: 800
        svg:
          optimize: true

collections:
  - name: links
    label: Buttons
    label_singular: button
    description: The big buttons on the home page. Lower numbers appear first.
    folder: src/content/links
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    fields:
      - label: Button text
        name: title
        widget: string
      - label: Web address
        name: url
        widget: string
        pattern: ["^(https?://|mailto:).+", "Start with https:// (or mailto: for an email address)"]
        hint: The full address the button opens, for example https://www.alamy.com/portfolio/hobley or mailto:you@example.com
      - label: Position
        name: order
        widget: number
        value_type: int
        min: 1
        default: 50
        hint: Lower numbers appear first. Use gaps like 10, 20, 30 so you can slot new buttons in between.
      - label: This is an affiliate link
        name: sponsored
        widget: boolean
        default: false
        required: false
        hint: Tick this for paid or affiliate links such as Amazon.

  - name: socials
    label: Social icons
    label_singular: social icon
    description: The round icons at the bottom of the home page. Lower numbers appear first.
    folder: src/content/socials
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    fields:
      - label: Name
        name: title
        widget: string
        hint: Shown when someone hovers over the icon and read out by screen readers.
      - label: Platform
        name: platform
        widget: select
        default: website
        options:
          - { label: Instagram, value: instagram }
          - { label: Twitter / X, value: x }
          - { label: YouTube, value: youtube }
          - { label: Twitch, value: twitch }
          - { label: Steam, value: steam }
          - { label: Spotify, value: spotify }
          - { label: LinkedIn, value: linkedin }
          - { label: Email, value: email }
          - { label: Other website, value: website }
        hint: Picks which icon is shown.
      - label: Web address
        name: url
        widget: string
        pattern: ["^(https?://|mailto:).+", "Start with https:// (or mailto: for an email address)"]
        hint: For example https://www.instagram.com/hobley/
      - label: Position
        name: order
        widget: number
        value_type: int
        min: 1
        default: 70
        hint: Lower numbers appear first. Use gaps like 10, 20, 30 so you can slot new icons in between.

  - name: pages
    label: Profile
    files:
      - name: profile
        label: Profile
        file: src/content/profile.json
        format: json
        fields:
          - label: Name
            name: name
            widget: string
          - label: Line under the name
            name: subtitle
            widget: string
            required: false
          - label: Intro
            name: intro
            widget: text
            required: false
            hint: One or two short sentences shown under the name.
          - label: Picture
            name: avatar
            widget: image
            required: false
            hint: Upload a square picture. It is shown as a circle.
